# server_db's MongoDB settings, built into the image (Dockerfile). What an LXC decides (its address, the
# cache size) comes from certificates/server_db.env through compose.yml instead.
net:
  port: 27017
  # Every address inside the container. Which addresses reach it is decided outside: the port is
  # published on the LXC's LAN address only (SDB_BIND), and the LXC's firewall lets in SDB_ALLOW_FROM.
  bindIpAll: true
security:
  # Always a login: one administrator for bin/sdb, and one per app for its own database only.
  authorization: enabled
storage:
  wiredTiger:
    collectionConfig:
      # Measured 2026-11-04 on Mahoraga's 24,452 jobs (110 MB of data): snappy, MongoDB's default,
      # 58.5 MB on disk; zstd 36.3 MB; zlib 39.9 MB.
      blockCompressor: zstd
operationProfiling:
  # A query slower than this is written to the log, with its plan: how a slow app is found.
  mode: off
  slowOpThresholdMs: 200
