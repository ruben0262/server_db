# server_db: MongoDB for every app on the Proxmox server. Run it through `bin/sdb`, never bare:
# the wrapper reads the settings in certificates/server_db.env, and a bare `docker compose` reads none.
name: server-db

services:
  mongo:
    # Our image (Dockerfile): MongoDB 8.0.34 with mongod.conf built in. `bin/sdb up` builds it; the drill's
    # throwaway MongoDB runs exactly this tag. The version is changed in the Dockerfile, on purpose
    # (DESIGN.md, "Staying up"), never by a pull that happened to land on a new one.
    build: .
    image: server-db-mongo:8.0.34
    restart: unless-stopped
    # Time to shut down cleanly when the VM reboots or `bin/sdb up` applies a change: it writes its cache
    # to disk first. Docker's 10 seconds can cut that short; systemd stops Docker itself after 90.
    stop_grace_period: 60s
    # The cache is set rather than left to MongoDB's own guess, which counts the host's memory, not
    # what this VM was given. The rest of its settings are in mongod.conf.
    command: ["mongod", "--config", "/etc/mongod.conf",
              "--wiredTigerCacheSizeGB", "${SDB_CACHE_GB:?how much memory MongoDB may use for its cache}"]
    environment:
      # Read once, when the data folder is empty: the first start creates this administrator.
      MONGO_INITDB_ROOT_USERNAME: ${SDB_ROOT_USER:?the administrator's name}
      MONGO_INITDB_ROOT_PASSWORD: ${SDB_ROOT_PASSWORD:?the administrator's password}
    ports:
      # Only on the VM's own LAN address (192.168.50.x), never 0.0.0.0: every machine on the LAN reaches it,
      # and a network card added to the VM later does not. Docker's published ports pass around ufw, so
      # this address is what decides who can connect; the router must not forward 27017 (DESIGN.md).
      - "${SDB_BIND:?the VM's LAN address apps connect to}:27017:27017"
    volumes:
      - ${SDB_DATA:?where the data lives, on the VM's data disk}:/data/db
    # The health check is the image's own (Dockerfile).
    ulimits:
      nofile: {soft: 64000, hard: 64000}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
